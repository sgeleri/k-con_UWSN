[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kcon-uwsn"
version = "0.1.0"
description = "Paper-traceable implementation of non-uniform k-connectivity for UWSNs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "highspy",
    "matplotlib",
    "numpy",
    "pulp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
